<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- White background sphere -->
  <circle cx="100" cy="100" r="95" fill="white" stroke="#000" stroke-width="1"/>
  
  <!-- Radial gradient for 3D effect -->
  <defs>
    <radialGradient id="volleyballGradient" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Apply gradient -->
  <circle cx="100" cy="100" r="95" fill="url(#volleyballGradient)"/>
  
  <!-- Top curved line section -->
  <path d="M 100 20 Q 130 40 140 70" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 100 20 Q 70 40 60 70" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Upper middle curved line section -->
  <path d="M 60 70 Q 50 100 60 130" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 140 70 Q 150 100 140 130" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Lower curved line section -->
  <path d="M 60 130 Q 70 160 100 180" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 140 130 Q 130 160 100 180" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Horizontal dividing line across middle -->
  <ellipse cx="100" cy="100" rx="95" ry="20" fill="none" stroke="#000" stroke-width="1.5"/>
  
  <!-- Top panel dividing lines -->
  <path d="M 85 50 Q 85 70 80 90" stroke="#000" stroke-width="1" fill="none"/>
  <path d="M 115 50 Q 115 70 120 90" stroke="#000" stroke-width="1" fill="none"/>
  <path d="M 100 35 L 100 75" stroke="#000" stroke-width="1" fill="none"/>
  
  <!-- Bottom panel dividing lines -->
  <path d="M 85 150 Q 85 130 80 110" stroke="#000" stroke-width="1" fill="none"/>
  <path d="M 115 150 Q 115 130 120 110" stroke="#000" stroke-width="1" fill="none"/>
  <path d="M 100 165 L 100 125" stroke="#000" stroke-width="1" fill="none"/>
</svg>
